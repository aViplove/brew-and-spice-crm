{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page.has_previous %}
    <a href="?page={{ page.previous_page_number }}{% if q %}&q={{ q }}{% endif %}">‹ Prev</a>
  {% endif %}
  <span class="page-info">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a href="?page={{ page.next_page_number }}{% if q %}&q={{ q }}{% endif %}">Next ›</a>
  {% endif %}
</div>
{% endif %}
