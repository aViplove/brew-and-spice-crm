{% extends 'core/base.html' %}
{% block title %}Delete {{ kind }}{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card form-card">
  <h3>Delete this {{ kind }}?</h3>
  <p>You are about to permanently delete <strong>{{ object }}</strong>. This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <a href="{% url cancel_url %}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-danger">Yes, delete</button>
    </div>
  </form>
</div>
{% endblock %}
